hostname leaf4
!
feature ssh
feature lldp
!
clock timezone EST -5 0
!
ip domain-name corp.example.com
ip name-server 10.0.0.53 use-vrf management
ip name-server 10.0.1.53 use-vrf management
!
!
vrf context management
!
interface mgmt0
  description Management
  vrf member management
  ip address 172.20.20.4/24
  no shutdown
!
vrf context management
  ip route 0.0.0.0/0 172.20.20.1
!
ntp server 10.0.0.10 use-vrf management
ntp server 10.0.0.11 use-vrf management
!
logging logfile messages 5 size 4194304
logging level auth 5
logging server 10.0.0.50 use-vrf management
!
snmp-server location DC1 - Row A
snmp-server contact netops@corp.example.com
!
line console
  exec-timeout 10
line vty
  exec-timeout 10
