---
# Translate the vendor-neutral interface list into each resource module's shape.
- name: Build interface data for the resource modules
  ansible.builtin.set_fact:
    netcfg_l1_interfaces: "{{ lookup('ansible.builtin.template', 'interfaces.yml.j2') | from_yaml }}"
    netcfg_l3_interfaces: "{{ lookup('ansible.builtin.template', 'l3_interfaces.yml.j2') | from_yaml }}"

# Apply L2/L3 mode + admin state before addressing. Use merged when the
# global state is replaced — safer on n9kv with mode: layer3.
- name: Interfaces (description, enabled, MTU, L3 mode)
  cisco.nxos.nxos_interfaces:
    config: "{{ netcfg_l1_interfaces }}"
    state: "{{ 'merged' if netcfg_state == 'replaced' else netcfg_state }}"
  register: netcfg_l1_result

- name: Interface commands
  ansible.builtin.debug:
    msg: "{{ netcfg_l1_result.rendered if netcfg_state == 'rendered' else netcfg_l1_result.commands }}"

# n9kv rejects "no ip redirects" that state=replaced often emits. Use merged
# for live pushes; keep rendered/overridden/etc. when explicitly requested.
- name: L3 interfaces (IPv4 addressing)
  cisco.nxos.nxos_l3_interfaces:
    config: "{{ netcfg_l3_interfaces }}"
    state: "{{ 'merged' if netcfg_state == 'replaced' else netcfg_state }}"
  register: netcfg_l3_result
  when: netcfg_l3_interfaces | length > 0

- name: L3 interface commands
  ansible.builtin.debug:
    msg: "{{ netcfg_l3_result.rendered if netcfg_state == 'rendered' else netcfg_l3_result.commands }}"
  when: netcfg_l3_interfaces | length > 0
