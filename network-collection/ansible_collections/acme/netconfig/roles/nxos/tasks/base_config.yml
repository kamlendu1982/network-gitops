---
# nxos_config has no "content" param (unlike ios_config). Render Jinja to a
# file on the controller, then push with src so indented NX-OS blocks stay intact.

- name: Ensure render directory exists
  ansible.builtin.file:
    path: "{{ netcfg_render_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: Render base config to a file
  ansible.builtin.template:
    src: base_config.j2
    dest: "{{ netcfg_render_dir }}/{{ inventory_hostname }}_base_config.cfg"
    mode: "0640"
  delegate_to: localhost
  become: false

- name: Show rendered base config
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.file', netcfg_render_dir ~ '/' ~ inventory_hostname ~ '_base_config.cfg').splitlines() }}"
  when: netcfg_state == 'rendered'

- name: Push base config (backup first; save in a separate task)
  cisco.nxos.nxos_config:
    src: "{{ netcfg_render_dir }}/{{ inventory_hostname }}_base_config.cfg"
    backup: true
    backup_options:
      dir_path: "{{ netcfg_backup_dir }}"
      filename: "{{ inventory_hostname }}_pre_onboard.cfg"
    save_when: never
  register: netcfg_base_result
  when: netcfg_state != 'rendered'

- name: Save running-config after base config changes
  cisco.nxos.nxos_config:
    save_when: always
  when:
    - netcfg_state != 'rendered'
    - netcfg_base_result is changed

- name: Base config changes sent to the device
  ansible.builtin.debug:
    msg: "{{ netcfg_base_result.updates | default(netcfg_base_result.diff | default('no changes')) }}"
  when: netcfg_state != 'rendered'
