---
# Day-0 baseline for NX-OS.
#
# AAP ad-hoc ping works; network_cli and system /usr/bin/ssh both get
# "Connection reset by peer" during KEX against containerlab n9kv.
# Use ansible.builtin.raw with task-level ansible_connection=ssh so we ride
# the same Ansible SSH stack as ping. Inventory can keep network_cli for later.

- name: Ensure render directory exists
  ansible.builtin.file:
    path: "{{ netcfg_render_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: Render base config to a file
  ansible.builtin.template:
    src: base_config.j2
    dest: "{{ netcfg_render_dir }}/{{ inventory_hostname }}_base_config.cfg"
    mode: "0640"
  delegate_to: localhost
  become: false

- name: Show rendered base config
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.file', netcfg_render_dir ~ '/' ~ inventory_hostname ~ '_base_config.cfg').splitlines() }}"
  when: netcfg_state == 'rendered'

- name: Build base config line list
  ansible.builtin.set_fact:
    netcfg_base_lines: >-
      {{
        lookup('ansible.builtin.file', netcfg_render_dir ~ '/' ~ inventory_hostname ~ '_base_config.cfg').splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('equalto', '!')
        | list
      }}
  when: netcfg_state != 'rendered'

- name: Show connection target used for day-0 SSH
  ansible.builtin.debug:
    msg: >-
      host={{ inventory_hostname }}
      ansible_host={{ ansible_host | default('unset') }}
      ansible_port={{ ansible_port | default(22) }}
      inventory ansible_connection={{ ansible_connection | default('unset') }}
      day0 override=ssh/raw
  when: netcfg_state != 'rendered'

- name: Prove Ansible SSH login (raw show clock — same stack as ad-hoc ping)
  ansible.builtin.raw: show clock
  vars:
    ansible_connection: ssh
    ansible_become: false
    ansible_ssh_timeout: "{{ netcfg_ssh_timeout | default(60) | int }}"
    ansible_ssh_common_args: >-
      -o ConnectTimeout={{ netcfg_ssh_connect_timeout | default(30) | int }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  register: netcfg_ssh_preflight
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  retries: "{{ netcfg_push_retries | default(5) | int }}"
  delay: "{{ netcfg_push_delay | default(15) | int }}"
  until: (netcfg_ssh_preflight.rc | default(1)) == 0
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'

- name: Require Ansible SSH preflight success
  ansible.builtin.assert:
    that:
      - not (netcfg_ssh_preflight.unreachable | default(false) | bool)
      - (netcfg_ssh_preflight.rc | default(1)) == 0
    fail_msg: >-
      Ansible SSH raw to {{ ansible_host }}:{{ ansible_port | default(22) }} failed.
      unreachable={{ netcfg_ssh_preflight.unreachable | default(false) }}
      msg={{ netcfg_ssh_preflight.msg | default('') }}
      stdout={{ netcfg_ssh_preflight.stdout | default('') }}
      stderr={{ netcfg_ssh_preflight.stderr | default('') }}
      NOTE: ad-hoc ping succeeding only proves Python/SSH to something on that
      socket; it does not prove NX-OS accepts CLI. Run AAP ad-hoc module=raw
      args='show clock' against leaf4 with the same credential/EE. Banner
      timeout usually means n9kv SSH/port-forward on {{ ansible_port | default(22) }}
      is stuck — restart the containerlab node or check 'containerlab inspect'.
    quiet: true
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'

- name: Push base config via Ansible SSH raw
  ansible.builtin.raw: >-
    configure terminal ;
    {{ netcfg_base_lines | join(' ; ') }} ;
    end ;
    copy running-config startup-config
  vars:
    ansible_connection: ssh
    ansible_become: false
    ansible_ssh_timeout: "{{ netcfg_ssh_timeout | default(60) | int }}"
    ansible_ssh_common_args: >-
      -o ConnectTimeout={{ netcfg_ssh_connect_timeout | default(30) | int }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  register: netcfg_base_raw
  changed_when: netcfg_base_lines | length > 0
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'
    - netcfg_base_lines | length > 0


- name: Prove network_cli login (show version)
  cisco.nxos.nxos_command:
    commands: show version
  register: netcfg_nxos_preflight
  retries: "{{ netcfg_push_retries | default(3) | int }}"
  delay: "{{ netcfg_push_delay | default(10) | int }}"
  until: netcfg_nxos_preflight is succeeded
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'

- name: Push base config via network_cli
  cisco.nxos.nxos_config:
    lines: "{{ netcfg_base_lines }}"
    match: line
    save_when: never
  register: netcfg_base_result
  retries: "{{ netcfg_push_retries | default(3) | int }}"
  delay: "{{ netcfg_push_delay | default(10) | int }}"
  until: netcfg_base_result is succeeded
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'
    - netcfg_base_lines | length > 0

- name: Save running-config after network_cli base config changes
  cisco.nxos.nxos_config:
    save_when: always
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'
    - netcfg_base_result is defined
    - netcfg_base_result is changed

- name: Base config push result
  ansible.builtin.debug:
    msg: >-
      {{
        netcfg_base_raw.stdout_lines
        | default(netcfg_base_result.updates | default(netcfg_base_result.diff | default(netcfg_ssh_preflight.stdout_lines | default('no changes'))))
      }}
  when: netcfg_state != 'rendered'
