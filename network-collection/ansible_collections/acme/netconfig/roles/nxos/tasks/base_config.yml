---
# Day-0 baseline. AAP ad-hoc ping (OpenSSH) works to leaf4, but network_cli
# (paramiko/libssh) gets "Connection reset by peer" before any config apply.
# Default transport for push is OpenSSH from the controller; inventory can keep
# ansible_connection: network_cli for later modules. Set
# netcfg_nxos_cli_via: network_cli to use nxos_config instead.

- name: Ensure render directory exists
  ansible.builtin.file:
    path: "{{ netcfg_render_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: Render base config to a file
  ansible.builtin.template:
    src: base_config.j2
    dest: "{{ netcfg_render_dir }}/{{ inventory_hostname }}_base_config.cfg"
    mode: "0640"
  delegate_to: localhost
  become: false

- name: Show rendered base config
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.file', netcfg_render_dir ~ '/' ~ inventory_hostname ~ '_base_config.cfg').splitlines() }}"
  when: netcfg_state == 'rendered'

- name: Check device SSH port is reachable from the controller
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default(22) | int }}"
    timeout: "{{ netcfg_ssh_wait_timeout | default(30) | int }}"
    state: started
  delegate_to: localhost
  become: false
  when: netcfg_state != 'rendered'

- name: Build base config line list
  ansible.builtin.set_fact:
    netcfg_base_lines: >-
      {{
        lookup('ansible.builtin.file', netcfg_render_dir ~ '/' ~ inventory_hostname ~ '_base_config.cfg').splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('equalto', '!')
        | list
      }}
  when: netcfg_state != 'rendered'

- name: Require device login vars for OpenSSH push
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - ansible_host is defined
    fail_msg: >-
      OpenSSH day-0 push needs ansible_user and ansible_host
      (from the AAP Network/Machine credential + inventory).
    quiet: true
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'

- name: Render OpenSSH push script
  ansible.builtin.template:
    src: push_base_openssh.sh.j2
    dest: "{{ netcfg_render_dir }}/{{ inventory_hostname }}_push_base_openssh.sh"
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'
    - netcfg_base_lines | length > 0

- name: Push base config via OpenSSH (same stack as AAP ad-hoc ping)
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ netcfg_render_dir }}/{{ inventory_hostname }}_push_base_openssh.sh"
  environment:
    SSHPASS: "{{ ansible_password | default('') }}"
  delegate_to: localhost
  become: false
  register: netcfg_base_openssh
  changed_when: netcfg_base_openssh.rc == 0 and (netcfg_base_lines | length > 0)
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'openssh'
    - netcfg_base_lines | length > 0

- name: Prove network_cli login (show version)
  cisco.nxos.nxos_command:
    commands: show version
  register: netcfg_nxos_preflight
  retries: "{{ netcfg_push_retries | default(3) | int }}"
  delay: "{{ netcfg_push_delay | default(10) | int }}"
  until: netcfg_nxos_preflight is succeeded
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'

- name: Push base config via network_cli
  cisco.nxos.nxos_config:
    lines: "{{ netcfg_base_lines }}"
    match: line
    save_when: never
  register: netcfg_base_result
  retries: "{{ netcfg_push_retries | default(3) | int }}"
  delay: "{{ netcfg_push_delay | default(10) | int }}"
  until: netcfg_base_result is succeeded
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'
    - netcfg_base_lines | length > 0

- name: Save running-config after network_cli base config changes
  cisco.nxos.nxos_config:
    save_when: always
  when:
    - netcfg_state != 'rendered'
    - (netcfg_nxos_cli_via | default('openssh')) == 'network_cli'
    - netcfg_base_result is defined
    - netcfg_base_result is changed

- name: Base config push result
  ansible.builtin.debug:
    msg: >-
      {{
        netcfg_base_openssh.stdout_lines
        | default(netcfg_base_result.updates | default(netcfg_base_result.diff | default('no changes')))
      }}
  when: netcfg_state != 'rendered'
