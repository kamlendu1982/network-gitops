---
# Day 2: enforce banner + interfaces from Git (base_config skipped).
# Webhook PoC: use day2_banner.yml or day2_interfaces.yml (separate JTs).
#
#   ansible-playbook .../site.yml -e target=leaf4
#   ansible-playbook .../site.yml -e target=nxos --check --diff


- name: Enforce golden config
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  serial: "{{ batch_size | default('20%') }}"
  max_fail_percentage: 0
  vars:
    netcfg_onboarding: false
    netcfg_features: [banner, interfaces]
    netcfg_os_class_map:
      cisco.ios.ios: ios
      cisco.nxos.nxos: nxos
      arista.eos.eos: eos
      junipernetworks.junos.junos: junos

  tasks:
    - name: Prepare host (device class + Git intent)
      ansible.builtin.include_tasks:
        file: tasks/prepare_host.yml
        apply: {tags: [always]}
      tags: [always]

    - name: Apply golden config for this device class
      ansible.builtin.include_role:
        name: "acme.netconfig.{{ netcfg_device_class }}"
        apply: {tags: [always]}
      tags: [always]
