---
# Day 0: first-time onboarding. Pushes base_config, then banner and interfaces.
#
#   ansible-playbook acme.netconfig.onboard -e target=ios-rtr01
#   ansible-playbook acme.netconfig.onboard -e target=eos -e netcfg_state=rendered   # preview only

- name: Onboard network devices
  hosts: "{{ target | default('network') }}"
  gather_facts: false
  serial: "{{ batch_size | default(5) }}"
  max_fail_percentage: 0
  vars:
    netcfg_onboarding: true
    # Map ansible_network_os (e.g. from NetBox) -> role name under acme.netconfig.
    # Inventory may still set netcfg_device_class explicitly to override.
    netcfg_os_class_map:
      cisco.ios.ios: ios
      cisco.nxos.nxos: nxos
      arista.eos.eos: eos
      junipernetworks.junos.junos: junos

  tasks:
    - name: Resolve device class from ansible_network_os when not set
      ansible.builtin.set_fact:
        netcfg_device_class: "{{ netcfg_os_class_map[ansible_network_os] }}"
      when:
        - netcfg_device_class is not defined
        - ansible_network_os is defined
        - ansible_network_os in netcfg_os_class_map
      tags: [always]

    - name: Require a known device class
      ansible.builtin.assert:
        that:
          - netcfg_device_class is defined
          - netcfg_device_class in netcfg_os_class_map.values() | list
        fail_msg: >-
          Cannot resolve device class for {{ inventory_hostname }}.
          Set netcfg_device_class (ios|nxos|eos|junos) or ansible_network_os
          to one of: {{ netcfg_os_class_map.keys() | list | join(', ') }}.
        quiet: true
      tags: [always]

    - name: Apply golden config for this device class
      ansible.builtin.include_role:
        name: "acme.netconfig.{{ netcfg_device_class }}"
        apply: {tags: [always]}
      tags: [always]
