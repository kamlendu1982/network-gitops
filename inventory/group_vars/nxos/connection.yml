---
# Used when the project static inventory is the JT inventory.
# When JT inventory is NetBox, prepare_host does NOT reload this file
# (avoids flipping ansible_connection mid-play).
netcfg_device_class: nxos

ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.nxos.nxos
ansible_become: false
ansible_network_cli_ssh_type: paramiko
