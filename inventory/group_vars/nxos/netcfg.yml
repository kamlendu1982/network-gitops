---
# Loaded by prepare_host even when inventory is NetBox (connection comes from NetBox).
# Do NOT put ansible_connection / ansible_host here — re-setting connection mid-play
# can break network_cli against containerlab/n9kv.

ansible_network_cli_ssh_type: paramiko

# Fail-fast for lab testing (raise again once SSH/CLI is stable).
ansible_command_timeout: 30
ansible_connect_timeout: 10
ansible_persistent_command_timeout: 30
ansible_ssh_retries: 0

netcfg_configure_mgmt: false
netcfg_backup: false
netcfg_push_retries: 0
netcfg_push_delay: 0
netcfg_ssh_timeout: 15
netcfg_ssh_connect_timeout: 10
netcfg_ssh_wait_timeout: 10

# Keep ansible_connection=network_cli in NetBox.
# Day-0 uses ansible.builtin.raw with task-level ansible_connection=ssh.
netcfg_nxos_cli_via: openssh
