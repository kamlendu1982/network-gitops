---
# Loaded by prepare_host even when inventory is NetBox (connection comes from NetBox).
# Do NOT put ansible_connection / ansible_host here — re-setting connection mid-play
# can break network_cli against containerlab/n9kv.

# AAP EEs often default network_cli to libssh; that commonly RST against NX-OS labs.
# Ad-hoc "ping" uses plain SSH and can succeed while nxos_config fails — this fixes that.
ansible_network_cli_ssh_type: paramiko

ansible_command_timeout: 180
ansible_connect_timeout: 60
ansible_persistent_command_timeout: 180
ansible_ssh_retries: 3

netcfg_configure_mgmt: false
netcfg_backup: false
netcfg_push_retries: 3
netcfg_push_delay: 10
