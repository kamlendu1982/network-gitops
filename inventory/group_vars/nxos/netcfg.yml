---
# NX-OS role tuning (also loaded by prepare_host for NetBox JTs).
ansible_network_cli_ssh_type: paramiko

# Fail-fast while debugging lab SSH; raise once stable.
ansible_command_timeout: 30
ansible_connect_timeout: 10
ansible_persistent_command_timeout: 30
ansible_ssh_retries: 0

netcfg_configure_mgmt: false
netcfg_backup: false
netcfg_push_retries: 0
netcfg_push_delay: 0
netcfg_ssh_timeout: 15
netcfg_ssh_connect_timeout: 10
netcfg_ssh_wait_timeout: 10

# Day-0: ansible.builtin.raw + task-level ansible_connection=ssh
# (inventory stays network_cli for nxos_* modules later).
netcfg_nxos_cli_via: openssh
