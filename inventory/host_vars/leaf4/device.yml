---
# Intent for leaf4 (n9kv). Keep mgmt out of "interfaces" so day-2
# resource modules do not fight the onboarding baseline.
mgmt:
  interface: mgmt0
  vrf: management
  address: 172.20.20.4/24
  gateway: 172.20.20.1

interfaces:
  - name: loopback0
    description: Router ID
    enabled: true
    ipv4: 10.255.0.4/32
  - name: Ethernet1/1
    description: Uplink to spine
    enabled: true
    mtu: 9214
    ipv4: 10.30.0.5/30
  - name: Ethernet1/2
    description: Server rack A
    enabled: true
  - name: Ethernet1/3
    description: Unused
    enabled: false
