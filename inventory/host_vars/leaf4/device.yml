---
# Intent for leaf4 (n9kv). Keep mgmt out of "interfaces" so day-2
# resource modules do not fight the onboarding baseline.
#
# Mgmt IP/VRF/route are NOT pushed unless netcfg_configure_mgmt: true.
# leaf4 is already reachable via NetBox/containerlab — rewriting mgmt0
# with a wrong placeholder IP causes SSH session loss / command timeout.
netcfg_configure_mgmt: false

mgmt:
  interface: mgmt0
  vrf: management
  # Used for DNS/NTP/syslog "use-vrf" and only applied to the interface
  # when netcfg_configure_mgmt is true — set to the real mgmt CIDR first.
  address: 172.20.20.4/24
  gateway: 172.20.20.1


interfaces:
  - name: loopback0
    description: Router ID
    enabled: true
    ipv4: 10.255.0.4/32
  - name: Ethernet1/1
    description: Uplink to spine
    enabled: true
    mtu: 9214
    ipv4: 10.30.0.5/30
  - name: Ethernet1/2
    description: Server rack A
    enabled: true
  - name: Ethernet1/3
    description: Unused
    enabled: false
