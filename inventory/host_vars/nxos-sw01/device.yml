---
# Sample NX-OS host (optional). Prefer leaf4 for the containerlab lab.
mgmt:
  interface: mgmt0
  vrf: management
  address: 10.20.0.41/24
  gateway: 10.20.0.1

interfaces:
  - name: loopback0
    description: Router ID
    enabled: true
    ipv4: 10.255.0.41/32
  - name: Ethernet1/1
    description: Uplink to spine
    enabled: true
    mtu: 9214
    ipv4: 10.30.0.9/30
  - name: Ethernet1/2
    description: Server rack A
    enabled: true
  - name: Ethernet1/3
    description: Unused
    enabled: false
