---
# Static inventory for AAP "Sourced from a Project".
#
# AAP setup:
#   1. Inventories -> Add -> Source: Sourced from a Project
#   2. Project: gitops-networking-kam (this repo)
#   3. Inventory file: inventory/hosts.yml
#   4. Sync the source, then set the Job Template inventory to this new inventory
#   5. Limit / extra var: leaf4 (or leave empty to hit all hosts in "network")
#
# leaf4 = clab-vxlan-leaf4 (cisco_n9kv). Mgmt IP from `containerlab inspect --all`.
# If the AAP EE cannot route to 172.20.20.0/24, change leaf4 ansible_host/ansible_port
# to the containerlab host + published SSH port from `docker ps | grep leaf4`.
all:
  children:
    network:
      children:
        nxos:
          hosts:
            leaf4:
              ansible_host: 172.20.20.40
              # n9kv SSH inside the container is on 22; no host-port remap needed
              # when using the clab management IP directly.
              ansible_port: 22
            # Optional samples (not required for the leaf4 POC)
            nxos-sw01:
              ansible_host: 10.20.0.41
              ansible_port: 22
        ios:
          hosts:
            ios-rtr01:
              ansible_host: 10.20.0.11
              ansible_port: 22
        eos:
          hosts:
            eos-sw01:
              ansible_host: 10.20.0.21
              ansible_port: 22
        junos:
          hosts:
            junos-rtr01:
              ansible_host: 10.20.0.31
              ansible_port: 830
