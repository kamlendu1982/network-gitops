---
# Static inventory for local / AAP "sourced from project" runs.
# Groups under "network" match the playbook default: hosts: "{{ target | default('network') }}"
# Limit with -e target=<group|host> or AAP Limit (e.g. target=leaf4 / Limit: leaf4).
all:
  children:
    network:
      children:
        ios:
          hosts:
            ios-rtr01:
              ansible_host: 10.20.0.11
        nxos:
          hosts:
            # Containerlab n9kv — matches AAP/NetBox leaf4 connection shape
            leaf4:
              ansible_host: containerlab
              ansible_port: 2225
            # Optional second sample (edit ansible_host for your lab)
            nxos-sw01:
              ansible_host: 10.20.0.41
        eos:
          hosts:
            eos-sw01:
              ansible_host: 10.20.0.21
        junos:
          hosts:
            junos-rtr01:
              ansible_host: 10.20.0.31
