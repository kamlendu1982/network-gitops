---
# Static inventory for AAP "Sourced from a Project".
#
# AAP setup:
#   1. Inventories -> Add -> Source: Sourced from a Project
#   2. Project: gitops-networking-kam
#   3. Inventory file: inventory/hosts.yml
#   4. Sync, then point the Job Template at this inventory
#   5. Limit: leaf4
#
# IMPORTANT: AAP Execution Environments cannot route to the containerlab
# management network (172.20.20.0/24). Use the containerlab HOST address and
# the published SSH port from:
#   docker ps --format 'table {{.Names}}\t{{.Ports}}' | grep -i leaf4
#
# leaf4 = clab-vxlan-leaf4 (cisco_n9kv). Inside the lab its mgmt IP is
# 172.20.20.40; that is only for device intent (host_vars), not ansible_host.
all:
  children:
    network:
      children:
        nxos:
          hosts:
            leaf4:
              # Reachable from AAP EE (containerlab VM / DNS name)
              ansible_host: containerlab
              # Published host port -> container :22 (confirm with docker ps)
              ansible_port: 2225
            nxos-sw01:
              ansible_host: 10.20.0.41
              ansible_port: 22
        ios:
          hosts:
            ios-rtr01:
              ansible_host: 10.20.0.11
              ansible_port: 22
        eos:
          hosts:
            eos-sw01:
              ansible_host: 10.20.0.21
              ansible_port: 22
        junos:
          hosts:
            junos-rtr01:
              ansible_host: 10.20.0.31
              ansible_port: 830
